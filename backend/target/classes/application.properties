server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret Key (Base64 or secure 256-bit string)
portfolio.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
portfolio.jwt.expiration-ms=86400000

